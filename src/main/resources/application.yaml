server:
  port: 8080

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    com.zaxxer.hikari: DEBUG
